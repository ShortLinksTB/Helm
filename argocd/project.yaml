apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shortlink
  namespace: argocd
spec:
  description: ShortLink workspace — dev environment
  sourceRepos:
    - git@github.com:ShortLinksTB/Helm.git
    # Wildcard so each future ShortLinksTB service repo's dev Application (see
    # argocd/README.md convention) is allowed as a sync source without a per-service edit here.
    - git@github.com:ShortLinksTB/*
  destinations:
    - namespace: shortlink-dev
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
