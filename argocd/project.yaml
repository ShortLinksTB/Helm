apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shortlink
  namespace: argocd
spec:
  description: ShortLink workspace — dev and production environments
  sourceRepos:
    - git@github.com:ShortLinksTB/Helm.git
    - https://kubernetes-sigs.github.io/headlamp/
    # Wildcard so each future ShortLinksTB service repo's dev Application (see
    # argocd/README.md convention) is allowed as a sync source without a per-service edit here.
    - git@github.com:ShortLinksTB/*
  destinations:
    - namespace: shortlink-dev
      server: https://kubernetes.default.svc
    - namespace: shortlink-infra-dev
      server: https://kubernetes.default.svc
    - namespace: shortlink-prd
      server: https://kubernetes.default.svc
    - namespace: shortlink-infra-prd
      server: https://kubernetes.default.svc
    - namespace: compareshop-dev
      server: https://kubernetes.default.svc
    - namespace: photoblog-dev
      server: https://kubernetes.default.svc
    - namespace: email-api-dev
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: headlamp
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
