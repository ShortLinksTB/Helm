apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-dev
  namespace: argocd
spec:
  project: shortlink
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/charts/headlamp/values-dev.yaml
    - repoURL: git@github.com:ShortLinksTB/Helm.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
