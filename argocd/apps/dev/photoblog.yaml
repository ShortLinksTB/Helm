apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photoblog-dev
  namespace: argocd
spec:
  project: shortlink
  sources:
    - repoURL: git@github.com:ShortLinksTB/Helm.git
      targetRevision: main
      path: charts/photoblog-api
      helm:
        releaseName: photoblog-api
        valueFiles: [values-dev.yaml]
    - repoURL: git@github.com:ShortLinksTB/Helm.git
      targetRevision: main
      path: charts/photoblog-admin
      helm:
        releaseName: photoblog-admin
        valueFiles: [values-dev.yaml]
    - repoURL: git@github.com:ShortLinksTB/Helm.git
      targetRevision: main
      path: charts/photoblog-ui
      helm:
        releaseName: photoblog-ui
        valueFiles: [values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: photoblog-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
