apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compareshop-auth-api-dev
  namespace: argocd
spec:
  project: shortlink
  source:
    repoURL: git@github.com:ShortLinksTB/Helm.git
    targetRevision: main
    path: charts/compareshop-auth-api
    helm:
      releaseName: compareshop-auth-api
      valueFiles: [values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: compareshop-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
