apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-dev
  namespace: argocd
spec:
  project: shortlink
  source:
    repoURL: git@github.com:ShortLinksTB/Helm.git
    targetRevision: main
    path: charts/rabbitmq
    helm:
      releaseName: rabbitmq
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink-infra-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
