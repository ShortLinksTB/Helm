apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adminui-dev
  namespace: argocd
spec:
  project: shortlink
  source:
    repoURL: git@github.com:ShortLinksTB/AdminUI.git
    targetRevision: dev
    path: charts/adminui
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
