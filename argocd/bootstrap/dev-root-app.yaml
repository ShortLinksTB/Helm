apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ShortLink
  namespace: argocd
spec:
  project: shortlink
  sources:
    - repoURL: git@github.com:ShortLinksTB/AdminUI.git
      targetRevision: dev
      path: charts/adminui
      helm:
        releaseName: adminui-dev
        valueFiles:
          - values-dev.yaml
    - repoURL: git@github.com:ShortLinksTB/ShortLinkUI.git
      targetRevision: dev
      path: charts/shortlinkui
      helm:
        releaseName: shortlinkui-dev
        valueFiles:
          - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
