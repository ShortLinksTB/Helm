apiVersion: batch/v1
kind: Job
metadata:
  name: photoblog-media-bucket
  namespace: photoblog-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mc alias set minio http://minio.shortlink-infra-dev.svc.cluster.local:9000
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing minio/photoblog-media
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: photoblog-minio-credentials
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoblog-minio-credentials
                  key: secret-key
