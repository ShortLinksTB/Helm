# Template for a new service's dev Application.
# Copy this file to argocd/apps/dev/<service>.yaml, fill in the placeholders below, and push
# to main of THIS repo. Do not create an apps/prd/ counterpart or a targetRevision: main
# variant yet — main is reserved for prd, which is out of scope until a [Promote][prd] issue
# exists. See ../README.md for the full convention.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <service>-dev # e.g. shortener-api-dev
  namespace: argocd
spec:
  project: shortlink
  source:
    repoURL: git@github.com:ShortLinksTB/<service-repo>.git # the SERVICE repo, not this Helm repo
    targetRevision: dev # the service repo's dev branch — never main at this stage
    path: <chart-path> # e.g. charts/<service>, adjust to where the service's Helm chart lives
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shortlink-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
