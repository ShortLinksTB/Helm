apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: redisinsight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redisinsight
  ports:
    - name: http
      port: 5540
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: redisinsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redisinsight
  template:
    metadata:
      labels:
        {{- include "shortlink-infra-dev.labels" . | nindent 8 }}
        app.kubernetes.io/name: redisinsight
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redisinsight
          image: {{ .Values.redisInsight.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5540
          env:
            - name: RI_APP_HOST
              value: "0.0.0.0"
            - name: RI_APP_PORT
              value: "5540"
            - name: RI_REDIS_HOST
              value: redis.shortlink-infra-dev.svc.cluster.local
            - name: RI_REDIS_PORT
              value: "6379"
            - name: RI_REDIS_ALIAS
              value: ShortLink Redis
            - name: RI_REDIS_USERNAME
              value: default
            - name: RI_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: redis-password
            - name: RI_REDIS_TLS
              value: "false"
            - name: RI_ACCEPT_TERMS_AND_CONDITIONS
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redisInsight.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redisinsight
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: redisinsight
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redisInsight.storage }}
