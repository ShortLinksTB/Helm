apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: redisinsight
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.redisInsight.storage }}
