apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        {{- include "shortlink-infra-dev.labels" . | nindent 8 }}
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: ["start-dev", "--http-enabled=true", "--health-enabled=true"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: keycloak-admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: keycloak-admin-password
            {{- if .Values.keycloak.hostname }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            {{- end }}
            {{- if .Values.keycloak.hostnameAdmin }}
            - name: KC_HOSTNAME_ADMIN
              value: {{ .Values.keycloak.hostnameAdmin | quote }}
            {{- end }}
            - name: KC_HOSTNAME_STRICT
              value: {{ .Values.keycloak.hostnameStrict | quote }}
            - name: KC_PROXY_HEADERS
              value: {{ .Values.keycloak.proxyHeaders | quote }}
            - name: KC_DB
              value: mssql
            - name: KC_DB_URL
              value: jdbc:sqlserver://mssql:1433;databaseName=keycloak;encrypt=false
            - name: KC_DB_USERNAME
              value: sa
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: mssql-sa-password
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 36
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
