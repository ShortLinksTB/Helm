apiVersion: v1
kind: Service
metadata:
  name: dbgate
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: dbgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dbgate
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dbgate
  labels:
    {{- include "shortlink-infra-dev.labels" . | nindent 4 }}
    app.kubernetes.io/name: dbgate
spec:
  serviceName: dbgate
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: dbgate
  template:
    metadata:
      labels:
        {{- include "shortlink-infra-dev.labels" . | nindent 8 }}
        app.kubernetes.io/name: dbgate
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: dbgate
          image: {{ .Values.dbgate.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: CONNECTIONS
              value: mssql
            - name: LABEL_mssql
              value: ShortLink MSSQL
            - name: SERVER_mssql
              value: mssql
            - name: PORT_mssql
              value: "1433"
            - name: USER_mssql
              value: sa
            - name: PASSWORD_mssql
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: mssql-sa-password
            - name: ENGINE_mssql
              value: mssql@dbgate-plugin-mssql
            - name: READONLY_mssql
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dbgate.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /root/.dbgate
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.dbgate.storage }}
