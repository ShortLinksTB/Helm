credentialsSecret: shortlink-infra-credentials

mssql:
  image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

redis:
  image: redis:7.4.2-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  image: rabbitmq:3.13.7-management
  storage: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
