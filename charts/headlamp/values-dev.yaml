replicaCount: 1

serviceAccount:
  create: true
  name: headlamp-admin

# SL-32 (owner-approved, reverses the SL-17 least-privilege decision): Andy uses
# Headlamp as a remote cluster management UI, so it now needs cluster-admin.
# Headlamp is publicly exposed via Cloudflare Tunnel, so the bearer token this
# SA can mint equals full cluster control — mint short-lived tokens only
# (kubectl -n headlamp create token headlamp-admin --duration=8h), and see SL-33
# for the follow-up to add Cloudflare Access in front of the public hostname.
clusterRoleBinding:
  create: true

persistentVolumeClaim:
  enabled: false

ingress:
  enabled: false

config:
  inCluster: true
  inClusterContextName: shortlink-dev
  enableHelm: false
  unsafeUseServiceAccountToken: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# The namespaced headlamp-reader Role/RoleBinding from SL-17 are removed: the SA
# is renamed to headlamp-admin and cluster-admin (above) supersedes them.
