replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/photoblog-admin
  tag: "c5c11f43a176cc24adab54238dfa44a322032acb"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

static:
  enabled: false
  indexHtml: |-
    <!doctype html><html><head><meta charset="utf-8"><title>PhotoBlog Admin</title></head><body><main><h1>PhotoBlog Admin</h1><p>Scaffold ready.</p></main></body></html>
  nginxConf: |-
    events {}
    http {
      server {
        listen 80;
        root /usr/share/nginx/html;
        location / { try_files $uri /index.html; }
      }
    }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

