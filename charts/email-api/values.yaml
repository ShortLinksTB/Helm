replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/emailapi
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  port: 8080

database:
  secretName: email-api-db
  secretKey: connection-string

infra:
  secretName: email-api-infra-credentials
  rabbitMqHost: rabbitmq.shortlink-infra-dev.svc.cluster.local
  rabbitMqPort: 5672
  redisConnection: redis.shortlink-infra-dev.svc.cluster.local:6379

emailSending:
  mode: Mock
  sendReal: false

compareShopUI:
  baseUrl: ""

outbox:
  enabled: false
  serviceKey:
    secretName: email-api-outbox-auth
    secretKey: service-key
    header: X-EmailAPI-Outbox-Key
  networkPolicy:
    readerNamespace: email-api-dev
    readerPodLabel:
      key: app.kubernetes.io/name
      value: email-api-outbox-reader

qcRunner:
  enabled: false
  image: curlimages/curl:8.12.1
  publisherSecret:
    name: email-api-qc-publisher
    usernameKey: username
    passwordKey: password
  outboxServiceKey:
    secretName: email-api-outbox-auth
    secretKey: service-key
    header: X-EmailAPI-Outbox-Key
  rabbitMq:
    host: rabbitmq.shortlink-infra-dev.svc.cluster.local
    port: 5672
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

resources: {}
