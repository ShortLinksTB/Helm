apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runtime
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.js: |
    window.__APP_CONFIG__ = {
      AUTH_API_URL: {{ .Values.runtimeConfig.authApiUrl | quote }},
      TURNSTILE_ENABLED: {{ .Values.runtimeConfig.turnstileEnabled }},
      TURNSTILE_SITE_KEY: {{ .Values.runtimeConfig.turnstileSiteKey | quote }}
    };
