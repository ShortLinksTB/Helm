replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/compare-shop-ui
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
