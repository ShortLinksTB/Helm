apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  annotations:
    argocd.argoproj.io/tracking-id: rabbitmq-dev:/Service:shortlink-infra-dev/rabbitmq
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: shortlink-infra
spec:
  type: ClusterIP
  {{- if .Values.externalIP }}
  externalIPs:
    - {{ .Values.externalIP | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-enabled-plugins
  annotations:
    argocd.argoproj.io/tracking-id: rabbitmq-dev:/ConfigMap:shortlink-infra-dev/rabbitmq-enabled-plugins
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: shortlink-infra
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
{{- if .Values.emailPublisherTopology.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-email-publisher-topology
  annotations:
    argocd.argoproj.io/tracking-id: rabbitmq-dev:/ConfigMap:shortlink-infra-dev/rabbitmq-email-publisher-topology
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: shortlink-infra
data:
  rabbitmq.conf: |
    management.load_definitions = /etc/rabbitmq/email-publisher/definitions.json
  definitions.json: {{ dict "rabbit_version" "3.13.7" "users" (list) "vhosts" (list (dict "name" "/")) "permissions" (list) "topic_permissions" (list) "parameters" (list) "global_parameters" (list) "policies" (list) "queues" (list (dict "name" .Values.emailPublisherTopology.queue "vhost" "/" "durable" true "auto_delete" false "arguments" (dict "x-dead-letter-exchange" .Values.emailPublisherTopology.deadLetterExchange "x-dead-letter-routing-key" .Values.emailPublisherTopology.deadLetterRoutingKey))) "exchanges" (list (dict "name" .Values.emailPublisherTopology.exchange "vhost" "/" "type" "direct" "durable" true "auto_delete" false "internal" false "arguments" (dict))) "bindings" (list (dict "source" .Values.emailPublisherTopology.exchange "vhost" "/" "destination" .Values.emailPublisherTopology.queue "destination_type" "queue" "routing_key" .Values.emailPublisherTopology.queue "arguments" (dict))) | toJson | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  annotations:
    argocd.argoproj.io/tracking-id: rabbitmq-dev:apps/StatefulSet:shortlink-infra-dev/rabbitmq
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: shortlink-infra
spec:
  serviceName: rabbitmq
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: shortlink-infra
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: fix-erlang-cookie-permissions
          image: {{ .Values.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
                chown 999:999 /var/lib/rabbitmq/.erlang.cookie;
                chmod 0400 /var/lib/rabbitmq/.erlang.cookie;
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: {{ .Values.image | quote }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: rabbitmq-username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: rabbitmq-password
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: enabled-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            {{- if .Values.emailPublisherTopology.enabled }}
            - name: email-publisher-topology
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: email-publisher-topology
              mountPath: /etc/rabbitmq/email-publisher
            {{- end }}
      volumes:
        - name: enabled-plugins
          configMap:
            name: rabbitmq-enabled-plugins
        {{- if .Values.emailPublisherTopology.enabled }}
        - name: email-publisher-topology
          configMap:
            name: rabbitmq-email-publisher-topology
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage }}
