image: rabbitmq:3.13.7-management
credentialsSecret: shortlink-infra-credentials
storage: 5Gi
externalIP: ""
emailPublisherTopology:
  enabled: false
  exchange: email-send-requests-publisher
  queue: email-send-requests
  deadLetterExchange: email-send-requests-dlq
  deadLetterRoutingKey: email-send-requests
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
