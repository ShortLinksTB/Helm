replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/shortlink-api
  # Promote the image currently deployed by the dev gate; Git source remains main.
  tag: "957cc794a679048c3fc39ab88f44635615d70f5d"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: api.surl.blog

env:
  aspnetEnvironment: Production
  keycloakRequireHttpsMetadata: true
  databaseSecretName: shortlink-mssql
  databaseSecretKey: connection-string
  keycloakAuthority: https://keycloak.surl.blog/realms/shortlink
  keycloakAudience: account
  minioEndpoint: minio.shortlink-infra-prd.svc.cluster.local:9000
  minioBucket: shortlink-ads
  minioUseSsl: false
  minioPublicEndpoint: minio.surl.blog
  minioPublicUseSsl: true
  minioCredentialsSecretName: shortlink-infra-credentials
  minioAccessKeySecretKey: minio-root-user
  minioSecretKeySecretKey: minio-root-password
  redisEndpoint: redis.shortlink-infra-prd.svc.cluster.local:6379
  redisPasswordSecretName: shortlink-infra-credentials
  redisPasswordSecretKey: redis-password
  corsOrigins:
    - https://surl.blog
    - https://admin.surl.blog
  rabbitMqHost: rabbitmq.shortlink-infra-prd.svc.cluster.local
  rabbitMqPort: 5672
  rabbitMqVirtualHost: /
  rabbitMqCredentialsSecretName: shortlink-infra-credentials
  rabbitMqUsernameSecretKey: rabbitmq-username
  rabbitMqPasswordSecretKey: rabbitmq-password

resources: {}
