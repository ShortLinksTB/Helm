apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortlink-api.fullname" . }}
  labels:
    {{- include "shortlink-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shortlink-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "shortlink-api.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: shortlink-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.aspnetEnvironment | quote }}
            - name: Keycloak__RequireHttpsMetadata
              value: {{ .Values.env.keycloakRequireHttpsMetadata | quote }}
            - name: Database__ApplyMigrations
              value: "true"
            - name: ConnectionStrings__ShortLinkDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseSecretName }}
                  key: {{ .Values.env.databaseSecretKey }}
            - name: Keycloak__Authority
              value: {{ .Values.env.keycloakAuthority | quote }}
            - name: Keycloak__Audience
              value: {{ .Values.env.keycloakAudience | quote }}
            {{- range $index, $origin := .Values.env.corsOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
