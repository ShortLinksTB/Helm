replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/compareshop-auth-api
  tag: sha-7b04d74fd1916f5a9d3abc39d48cbc0f407fd475
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: auth-compareshop-dev.giamha.online
  path: /
  pathType: Prefix

database:
  secretName: compareshop-auth-api-runtime
  connectionStringKey: connection-string
  applyMigrations: false

signing:
  secretName: compareshop-auth-api-signing-key
  privateKeyKey: rsa-private-key.pem
  mountPath: /run/auth-secrets/signing

outbox:
  secretName: compareshop-auth-api-runtime
  encryptionKey: email-outbox-encryption-key

throttle:
  secretName: compareshop-auth-api-runtime
  hashKey: throttle-hash-key

pin:
  secretName: compareshop-auth-api-runtime
  pepperKey: pin-pepper

rabbitmq:
  host: rabbitmq.shortlink-infra-dev.svc.cluster.local
  secretName: compareshop-auth-api-publisher
  usernameKey: username
  passwordKey: password

env:
  aspnetEnvironment: Development
  issuer: https://auth-compareshop-dev.giamha.online
  audience: compareshop-api
  keyId: compareshop-auth-dev-1
  retryOnFailure: true
  otlpEndpoint: http://tempo.shortlink-infra-dev.svc.cluster.local:4317
  uiOrigin: https://compareshop-dev.giamha.online
  corsOrigins:
    - https://compareshop-dev.giamha.online
