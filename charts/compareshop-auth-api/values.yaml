replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/compareshop-auth-api
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

database:
  secretName: compareshop-auth-api-runtime
  connectionStringKey: connection-string
  applyMigrations: false

signing:
  secretName: compareshop-auth-api-signing-key
  privateKeyKey: rsa-private-key.pem
  mountPath: /run/auth-secrets/signing

outbox:
  secretName: compareshop-auth-api-runtime
  encryptionKey: email-outbox-encryption-key

env:
  aspnetEnvironment: Production
  issuer: https://auth-compareshop-dev.giamha.online
  audience: compareshop-api
  keyId: compareshop-auth-dev-1
  retryOnFailure: true
  otlpEndpoint: http://tempo.shortlink-infra-dev.svc.cluster.local:4317
  corsOrigins:
    - https://compareshop-dev.giamha.online

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
    ephemeral-storage: 512Mi
