replicaCount: 1
containerPort: 8080

otel:
  endpoint: ""
  headersSecret:
    name: ""
    key: ""

image:
  repository: ghcr.io/shortlinkstb/photoblog-ui
  tag: "328102afd4fd0d4fc99ca7b62f1c5d748b1da6ed"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

static:
  enabled: false
  indexHtml: |-
    <!doctype html><html><head><meta charset="utf-8"><title>PhotoBlog</title></head><body><main><h1>PhotoBlog</h1><p>Scaffold ready.</p></main></body></html>
  nginxConf: |-
    events {}
    http {
      server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
        location / { try_files $uri /index.html; }
      }
    }

service:
  type: ClusterIP
  port: 80

api:
  baseUrl: "https://api-shortlink-dev.giamha.online"
  guestBaseUrl: "https://app-shortlink-dev.giamha.online"

database:
  connectionStringSecret:
    name: shortlink-mssql
    key: connection-string

publicOrigin: ""

ingress:
  enabled: false
  className: nginx
  host: app-shortlink-dev.giamha.online
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

