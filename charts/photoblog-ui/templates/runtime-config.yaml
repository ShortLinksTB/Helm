apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runtime
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.js: |
    window.__SHORTLINK_CONFIG__ = { apiBaseUrl: {{ .Values.api.baseUrl | quote }}, guestBaseUrl: {{ .Values.api.guestBaseUrl | quote }} };

