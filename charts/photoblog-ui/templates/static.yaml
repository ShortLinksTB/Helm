{{- if .Values.static.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-static
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
{{ .Values.static.indexHtml | indent 4 }}
  nginx.conf: |
{{ .Values.static.nginxConf | indent 4 }}
{{- end }}
