replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/photoblog-api
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: api-photoblog-dev.giamha.online

database:
  connectionStringSecret:
    name: photoblog-db
    key: connection-string

env:
  databaseSecretName: photoblog-db
  databaseSecretKey: connection-string
  rabbitMqCredentialsSecretName: photoblog-infra-credentials
  rabbitMqUsernameSecretKey: rabbitmq-username
  rabbitMqPasswordSecretKey: rabbitmq-password
  rabbitMqHost: rabbitmq.shortlink-infra-dev.svc.cluster.local
  rabbitMqPort: 5672
  rabbitMqVirtualHost: /
  minioEndpoint: http://minio.shortlink-infra-dev.svc.cluster.local:9000
  minioBucket: photoblog-media
  minioUseSsl: false
  minioCredentialsSecretName: photoblog-minio-credentials
  minioAccessKeySecretKey: access-key
  minioSecretKeySecretKey: secret-key
  redisEndpoint: redis.shortlink-infra-dev.svc.cluster.local:6379
  redisPasswordSecretName: photoblog-infra-credentials
  redisPasswordSecretKey: redis-password

  aspnetEnvironment: Development
  keycloakRequireHttpsMetadata: true
  keycloakAuthority: https://auth.giamha.online/realms/shortlink
  keycloakAudience: account
  jwtIssuer: https://auth.giamha.online/realms/shortlink
  jwtSigningKeySecretName: photoblog-auth
  jwtSigningKeySecretKey: signing-key
  minioPublicEndpoint: minio-s3-shortlink-dev.giamha.online
  minioPublicUseSsl: true
  geoIpFixtureEnabled: true
  geoIpFixtureSuccessIp: 198.51.100.10
  geoIpFixtureSuccessCountry: US
  geoIpFixtureFailureIp: 198.51.100.11
  geoIpFixtureFailureMode: timeout
  geoIpFixtureFailureDelayMilliseconds: 250
  corsOrigins:
    - https://photoblog-dev.giamha.online
    - https://photoblog-admin-dev.giamha.online

fixture:
  enabled: true
  postsJson: |
    [
      {
        "Id": "11111111-1111-1111-1111-111111111111",
        "Title": "Golden Hour Field Notes",
        "Slug": "test",
        "Markdown": "# Golden Hour Field Notes\n\nA practical guide to finding warm light, shaping shadows, and keeping skin tones natural.\n\nStart with the light behind you, then move until the background falls softly out of focus.",
        "CategoryId": null,
        "Tags": ["Lighting", "Field Notes"],
        "CoverImage": "https://photoblog-dev.giamha.online/og-image.svg",
        "AuthorId": null,
        "Published": true,
        "Excerpt": "A practical guide to finding warm light and shaping shadows."
      },
      {
        "Id": "22222222-2222-2222-2222-222222222222",
        "Title": "Backlight Without the Burn",
        "Slug": "unsafe-excerpt",
        "Markdown": "# Backlight Without the Burn\n\n<img src=x onerror=\"alert('unsafe-excerpt')\">\n\nThis excerpt intentionally contains markup-like input so the live rendering gate can verify it is displayed safely as text.",
        "CategoryId": null,
        "Tags": ["Composition", "Safety"],
        "CoverImage": "https://photoblog-dev.giamha.online/og-image.svg",
        "AuthorId": null,
        "Published": true,
        "Excerpt": "<img src=x onerror=\"alert('unsafe-excerpt')\">"
      }
    ]


