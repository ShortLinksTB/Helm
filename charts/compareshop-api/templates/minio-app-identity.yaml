{{- $name := include "compareshop-api.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-minio-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-minio-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.env.minioAppCredentialsSecretName }}"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-minio-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-minio-provisioner
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-minio-provisioner
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.env.minioAppCredentialsSecretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-minio-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  requirements.txt: |
    minio==7.2.20
  provision.py: |
    import base64, json, os, secrets, ssl, sys, urllib.error, urllib.request
    from minio.credentials import StaticProvider
    from minio.minioadmin import MinioAdmin

    APP_ACCESS = "compareshop-files"
    SECRET_NAME = "{{ .Values.env.minioAppCredentialsSecretName }}"
    NAMESPACE = "{{ .Release.Namespace }}"
    API = "https://kubernetes.default.svc"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    ctx = ssl.create_default_context(cafile=CA_PATH)
    token = open(TOKEN_PATH, encoding="utf-8").read().strip()

    def k8s(method, path, body=None):
        data = None if body is None else json.dumps(body, separators=(",", ":")).encode()
        req = urllib.request.Request(API + path, data=data, method=method, headers={
            "Authorization": "Bearer " + token,
            "Accept": "application/json",
            "Content-Type": "application/merge-patch+json",
        })
        with urllib.request.urlopen(req, context=ctx, timeout=15) as response:
            return json.load(response)

    try:
        path = f"/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"
        current = k8s("GET", path).get("data", {})
        access_b64, secret_b64 = current.get("access-key"), current.get("secret-key")
        if bool(access_b64) != bool(secret_b64):
            raise RuntimeError("application Secret has only one credential field")
        if access_b64:
            access = base64.b64decode(access_b64).decode()
            secret = base64.b64decode(secret_b64).decode()
            if access != APP_ACCESS:
                raise RuntimeError("application Secret access key does not match the approved identity")
        else:
            access, secret = APP_ACCESS, secrets.token_urlsafe(48)

        admin = MinioAdmin(
            endpoint="{{ trimPrefix "http://" .Values.env.minioEndpoint }}",
            credentials=StaticProvider(
                os.environ["MINIO_ROOT_USER"], os.environ["MINIO_ROOT_PASSWORD"]
            ),
            secure=False,
        )
        policy = {
            "Version": "2012-10-17",
            "Statement": [
                {"Effect": "Allow", "Action": ["s3:ListBucket"],
                 "Resource": ["arn:aws:s3:::{{ .Values.env.minioBucket }}"]},
                {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
                 "Resource": ["arn:aws:s3:::{{ .Values.env.minioBucket }}/*"]},
            ],
        }
        admin.user_add(access, secret)
        admin.policy_add("compareshop-files-app", policy=policy)
        admin.policy_set("compareshop-files-app", user=access)
        if not access_b64:
            k8s("PATCH", path, {"data": {
                "access-key": base64.b64encode(access.encode()).decode(),
                "secret-key": base64.b64encode(secret.encode()).decode(),
            }})
        print("Dedicated bucket identity reconciled; credentials redacted.")
    except Exception as exc:
        # Never include exception text: SDK/API errors may contain request details.
        print("Provisioning failed (" + type(exc).__name__ + "); details redacted.", file=sys.stderr)
        sys.exit(1)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-minio-app-identity
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ $name }}-minio-provisioner
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-identity
          image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m pip install --disable-pip-version-check --no-cache-dir --quiet --target=/tmp/python -r /config/requirements.txt
              && exec python /config/provision.py
          env:
            - name: PIP_CACHE_DIR
              value: /tmp/pip-cache
            - name: PYTHONPATH
              value: /tmp/python
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioAdminCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioAccessKeySecretKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioAdminCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioSecretKeySecretKey | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-minio-provisioner
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
