apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compareshop-api.fullname" . }}
  labels:
    {{- include "compareshop-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "compareshop-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "compareshop-api.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: compareshop-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: HOME
              value: /home/app
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.aspnetEnvironment | quote }}
            # appsettings are baked into the image; startup must not depend on host inotify capacity.
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
            - name: ConnectionStrings__CompareShopDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            - name: Database__ApplyMigrations
              value: {{ .Values.database.applyMigrations | quote }}
            - name: Keycloak__Authority
              value: {{ .Values.env.keycloakAuthority | quote }}
            - name: Keycloak__Audience
              value: {{ .Values.env.keycloakAudience | quote }}
            {{- range $index, $subject := .Values.env.bootstrapSuperAdminSubjects }}
            - name: Admin__BootstrapSuperAdminSubjects__{{ $index }}
              value: {{ $subject | quote }}
            {{- end }}
            - name: Redis__KeyPrefix
              value: {{ .Values.env.redisKeyPrefix | quote }}
            - name: RabbitMQ__Host
              value: {{ .Values.env.rabbitMqHost | quote }}
            - name: RabbitMQ__QueuePrefix
              value: {{ .Values.env.rabbitMqQueuePrefix | quote }}
            {{- with .Values.env.rabbitMqCredentialsSecretName }}
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: password
            {{- end }}
            - name: OpenTelemetry__ServiceName
              value: compareshop-api
            - name: OpenTelemetry__OtlpEndpoint
              value: {{ .Values.env.otlpEndpoint | quote }}
            {{- range $index, $origin := .Values.env.corsOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
            {{- range $index, $proxy := .Values.env.affiliateRedirectTrustedProxies }}
            - name: RateLimiting__AffiliateRedirect__TrustedProxies__{{ $index }}
              value: {{ $proxy | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
