apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compareshop-api.fullname" . }}
  labels:
    {{- include "compareshop-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "compareshop-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "compareshop-api.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: compareshop-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.aspnetEnvironment | quote }}
            - name: Database__ApplyMigrations
              value: "false"
            - name: ConnectionStrings__CompareShopDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.databaseSecretName }}
                  key: {{ .Values.env.databaseSecretKey }}
            - name: Keycloak__Authority
              value: {{ .Values.env.keycloakAuthority | quote }}
            - name: Keycloak__Audience
              value: {{ .Values.env.keycloakAudience | quote }}
            - name: Redis__KeyPrefix
              value: "compareshop:"
            - name: RabbitMQ__Host
              value: rabbitmq.shortlink-infra-dev.svc.cluster.local
            - name: RabbitMQ__QueuePrefix
              value: "compareshop."
            - name: OpenTelemetry__ServiceName
              value: compareshop-api
            - name: OpenTelemetry__OtlpEndpoint
              value: http://tempo.shortlink-infra-dev.svc.cluster.local:4317
            {{- range $index, $origin := .Values.env.corsOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
