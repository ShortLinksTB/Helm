apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "compareshop-api.fullname" . }}-files-bucket
  labels:
    {{- include "compareshop-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "compareshop-api.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - >-
              export MC_HOST_minio="http://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@{{ trimPrefix "http://" .Values.env.minioEndpoint }}" &&
              mc mb --ignore-existing minio/{{ .Values.env.minioBucket }} &&
              printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::{{ .Values.env.minioBucket }}/*"]}]}' > /tmp/anonymous-readonly.json &&
              mc anonymous set-json /tmp/anonymous-readonly.json minio/{{ .Values.env.minioBucket }} &&
              mc anonymous get minio/{{ .Values.env.minioBucket }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioAdminCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioAccessKeySecretKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioAdminCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioSecretKeySecretKey | quote }}
