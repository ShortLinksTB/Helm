apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "compareshop-api.fullname" . }}-files-bucket
  labels:
    {{- include "compareshop-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        {{- include "compareshop-api.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mc alias set minio {{ .Values.env.minioEndpoint | quote }}
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing minio/{{ .Values.env.minioBucket }} &&
              mc anonymous set download minio/{{ .Values.env.minioBucket }} &&
              mc anonymous get minio/{{ .Values.env.minioBucket }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioAccessKeySecretKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.minioCredentialsSecretName | quote }}
                  key: {{ .Values.env.minioSecretKeySecretKey | quote }}
