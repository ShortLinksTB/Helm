replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/compareshop-api
  tag: 353af9a27cb4c2736aa16b2070863439f8be91a9
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: api-compareshop-dev.giamha.online
  path: /
  pathType: Prefix

database:
  secretName: compareshop-api-runtime
  secretKey: connection-string
  applyMigrations: false

env:
  aspnetEnvironment: Production
  keycloakAuthority: https://keycloak-shortlink-dev.giamha.online/realms/shortlink
  keycloakAudience: compareshop-admin-ui
  corsOrigins:
    - https://compareshop-dev.giamha.online
    - https://admin-compareshop-dev.giamha.online
  otlpEndpoint: http://tempo.shortlink-infra-dev.svc.cluster.local:4317
  redisKeyPrefix: "compareshop:"
  rabbitMqHost: rabbitmq.shortlink-infra-dev.svc.cluster.local
  rabbitMqQueuePrefix: compareshop.
  affiliateRedirectTrustedProxies:
    # Exact cloudflared pod IP observed on the public route (argocd namespace).
    - 10.42.0.225
