replicaCount: 1

image:
  repository: ghcr.io/shortlinkstb/compareshop-api
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
  pathType: Prefix

database:
  secretName: compareshop-api-runtime
  secretKey: connection-string
  applyMigrations: false

env:
  aspnetEnvironment: Production
  keycloakAuthority: https://keycloak-shortlink-dev.giamha.online/realms/shortlink
  keycloakAudience: compareshop-admin-ui
  minioEndpoint: http://minio.shortlink-infra-dev.svc.cluster.local:9000
  minioBucket: compareshop-files
  minioUseSsl: false
  minioAdminCredentialsSecretName: compareshop-minio-credentials
  minioAdminAccessKeySecretKey: access-key
  minioAdminSecretKeySecretKey: secret-key
  minioBucketInitCredentialsSecretName: compareshop-minio-credentials
  minioBucketInitAccessKeySecretKey: access-key
  minioBucketInitSecretKeySecretKey: secret-key
  minioAppCredentialsSecretName: compareshop-files-app-credentials
  minioAppAccessKeySecretKey: access-key
  minioAppSecretKeySecretKey: secret-key
  minioIdentityProvisioning:
    enabled: false
    jobImage: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    kubectlImage: rancher/kubectl:v1.32.3
  corsOrigins: []
  otlpEndpoint: http://tempo.shortlink-infra-dev.svc.cluster.local:4317
  redisKeyPrefix: "compareshop:"
  rabbitMqHost: rabbitmq.shortlink-infra-dev.svc.cluster.local
  rabbitMqQueuePrefix: compareshop.
  affiliateRedirectTrustedProxies: []

resources:
  requests:
    cpu: 100m
    memory: 512Mi
    ephemeral-storage: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 1Gi

workers:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/shortlinkstb/compareshop-api-workers
    tag: dev
    pullPolicy: IfNotPresent
  database:
    secretName: compareshop-api-runtime
    secretKey: connection-string
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
