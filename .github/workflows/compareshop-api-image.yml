name: Update CompareShop API image

on:
  repository_dispatch:
    types: [compareshop-api-image-published]

permissions:
  contents: write

jobs:
  update:
    if: github.event.client_payload.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update dev image tag
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          sed -i -E "/^image:/,/^[^ ]/ s/^  tag: .*/  tag: ${TAG}/" charts/compareshop-api/values-dev.yaml
          sed -i -E "/^workers:/,/^[^ ]/ s/^    tag: .*/    tag: ${TAG}/" charts/compareshop-api/values-dev.yaml
          sed -i -E "/^workers:/,/^[^ ]/ s/^  enabled: false$/  enabled: true/" charts/compareshop-api/values-dev.yaml

      - name: Commit image update
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add charts/compareshop-api/values-dev.yaml
          git diff --cached --quiet || git commit -m "chore(compareshop-api): deploy ${TAG} to dev"
          git push origin main
